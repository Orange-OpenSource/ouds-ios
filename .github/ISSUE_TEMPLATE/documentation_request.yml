name: Documentation Update
description: Describe this issue found in the documentation
title: "In documentation, ..."
labels: ["🧰 library", "📖 documentation", "🔍 triage"]
assignees: ["ludovic35", "pylapp"]
type: Task
projects: ["Orange-OpenSource/40"]
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation Location
      description: Where in the documentation should there be an update? Add for example the hyperlink to the page.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Current issue
      description: A description of what is currently in the doc. Add anotated screenshots if possible.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Expected Correction
      description: A clear and concise description of what you expected to be updated.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false